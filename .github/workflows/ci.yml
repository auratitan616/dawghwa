name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: End-to-end (UI-only; live-data tests skip without an API)
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build debug APK
        env:
          VITE_API_BASE_URL: ${{ vars.DAWGHWA_API_URL }}
          # Without a configured API the APK is a UI-only smoke build.
          ALLOW_NO_API: ${{ vars.DAWGHWA_API_URL == '' && '1' || '0' }}
        run: npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: dawghwa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
