name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: End-to-end (live-data tests run against DAWGHWA_API_URL when set, and skip if it is unreachable)
        env:
          DAWGHWA_API_DEV: ${{ vars.DAWGHWA_API_URL }}
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm ci
      - name: Build debug APK
        env:
          VITE_API_BASE_URL: ${{ vars.DAWGHWA_API_URL }}
          # Without a configured API the APK is a UI-only smoke build.
          ALLOW_NO_API: ${{ vars.DAWGHWA_API_URL == '' && '1' || '0' }}
        run: npm run android:build
      - name: Check the APK bundle points at the configured API
        if: vars.DAWGHWA_API_URL != ''
        run: grep -rqF "${{ vars.DAWGHWA_API_URL }}" android/app/src/main/assets/public/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dawghwa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
